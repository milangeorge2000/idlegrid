[project]
name = "idlegrid"
version = "0.1.0"
description = "Decentralized LLM inference on idle Macs and GPUs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.20"]
dev = ["pytest>=8"]

[project.scripts]
idlegrid-coordinator = "idlegrid.coordinator.app:main"
idlegrid-node = "idlegrid.agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["idlegrid*"]

[tool.setuptools.package-data]
"idlegrid.coordinator" = ["web/*"]
